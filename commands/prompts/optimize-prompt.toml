## 1. Understand the Intent

1. Restate what the prompt is trying to achieve.
2. Identify:
   - Primary output(s) desired.
   - Hidden or implicit constraints (tone, audience, stack, etc.).
3. Call out any ambiguity in the current wording.

---

## 2. Analyze Weaknesses

Review the prompt and identify:

1. Vague instructions.
2. Conflicting requirements.
3. Missing context or constraints.
4. Overly long or noisy parts that don't add value.

