prompt = """
# Write Incident Report / Post-Incident Review

You are an experienced Site Reliability Engineer, Incident Commander, and Technical Writer.
Write a clear, concise, and **blameless** incident report based on the information below.

## Incident Context

Use these details as the **source of truth**:

{{args}}

If any important detail is missing, **call it out explicitly** in the report under "Open Questions" rather than inventing information.

---

## Audience & Tone

- Primary readers: engineering teams, SRE/DevOps, product leadership, client-facing teams
- Secondary readers: non-technical stakeholders (account managers, operations, sometimes clients)
- Tone:
  - Professional, direct, and calm
  - Fact-based and **blameless** (focus on systems and processes, not individuals)
  - Avoid jargon where possible; briefly define unavoidable technical terms
  - Prefer clarity over drama; no sensational language

---

## Incident Metadata

At the top of the report, include a structured summary block:

- **Incident ID** (or placeholder if unknown)
- **Title** – concise, specific ("EU CDN misconfiguration causing CSS 500 errors")
- **Severity** – e.g., SEV-1/2/3 or High/Medium/Low (derive from impact if not provided, but mark with "(assessed)")
- **Status** – Resolved / Mitigated / Monitoring / Ongoing
- **Owner** – team or role, not individual where possible
- **Start Time**
- **End Time**
- **Duration**
- **Systems/Services Affected**
- **Primary Impact Type** – e.g., Outage, Degradation, Security, Data Integrity, Performance, UX
- **Customer Impact Summary** – 1–2 sentences

If a field is unknown, write: `Unknown (not provided)`.

---

## Report Structure

Structure the report under the following headings, in this order:

1. **Executive Summary**
2. **Impact**
3. **Timeline**
4. **Root Cause Analysis**
5. **Detection & Alerting**
6. **Mitigation & Resolution**
7. **Customer Communication**
8. **Corrective & Preventative Actions (CAPA)**
9. **What Went Well**
10. **What Didn't Go Well**
11. **Lessons Learned**
12. **Open Questions / Follow-ups**
13. **Appendix** (optional)

### 1. Executive Summary

Write 2–4 short paragraphs that answer:

- What happened?
- Who/what was impacted and how badly?
- How long did it last?
- What caused it (at a high level)?
- Is it fully resolved, mitigated, or still being monitored?

Keep this section understandable to non-technical stakeholders.

### 2. Impact

Describe **who** was impacted and **how**:

- User/customer scope: (%/count, geo, segment, tenant, or environment: prod/stage)
- Business impact: revenue, conversions, SLAs/SLOs, error budget burn, reputational risk
- Internal impact: support volume, engineering interruption, manual workarounds
- Data impact: any data loss, corruption, or integrity concerns
- Compliance/security implications if applicable

Use bullet points and concrete numbers if provided; otherwise use qualitative descriptions and explicitly note uncertainties.

### 3. Timeline

Provide a **chronological** timeline focused on key moments:

Format each entry as:
`[YYYY-MM-DD HH:MM TZ] — [Role/Channel] — [Event]`

Include items like:

- Issue actually started (first occurrence, if known)
- First detection (monitoring alert, client report, internal observation)
- Key investigative steps and major hypotheses
- Important changes (deploys, config changes, infra events)
- Escalations and handoffs
- Mitigation and final resolution
- Post-incident verification/monitoring

If exact timestamps are missing, approximate clearly (e.g., "~14:30 UTC (approx)").

### 4. Root Cause Analysis

Explain **why** this happened in a way that:

- Traces from **symptoms** → **proximate cause** → **underlying systemic causes**
- Distinguishes between:
  - **Triggering event** (e.g., config change, deployment)
  - **Contributing factors** (e.g., missing alert, lack of rate limiting, fragile dependency)
  - **Systemic issues** (e.g., process gaps, lack of test coverage, unclear ownership)

Use a small structured format such as:

- **Symptom:** what users/systems experienced
- **Proximate Cause:** immediate technical cause
- **Contributing Factors:** bullet list
- **Systemic Issues:** bullet list

Avoid blaming individuals; keep it about systems, processes, and design decisions.

### 5. Detection & Alerting

Describe:

- How the incident was detected (monitoring, client support, internal user, etc.)
- Which alerts fired (or should have fired)
- Signal quality: noisy, missing, or delayed alerts
- Time from incident start → detection
- Opportunities for earlier detection

End this section with **specific detection improvements** where applicable.

### 6. Mitigation & Resolution

Explain **what was done** to mitigate and resolve:

- Initial triage actions and quick mitigations
- Workarounds used (e.g., feature flags, rollbacks, traffic rerouting, manual fixes)
- Final fix that resolved the incident
- Verification steps (how you validated recovery)
- Remaining known risks or degraded states (if any)

Be concrete about actions, linking them to previous timeline events when relevant.

### 7. Customer Communication

Summarize:

- Whether status pages, client emails, or in-product banners were used
- Timing of first communication vs. detection and resolution
- Clarity and honesty of messages (no hand-wavy language)
- Feedback from customers or internal stakeholders, if known

If communication was lacking or delayed, state that and propose improvements.

### 8. Corrective & Preventative Actions (CAPA)

List **actionable** items grouped by type. For each item:

- Start with a strong verb (e.g., "Add", "Remove", "Automate", "Harden")
- Include owner/team and rough priority/severity where possible
- Make them specific enough to be ticketed

Group actions under these sub-headings:

- **Monitoring & Alerting**
- **Reliability & Architecture**
- **Process & Runbooks**
- **Testing & Quality**
- **Security & Compliance** (if relevant)

Example format:
- `[P1] Add alert on 5xx rate > 1% for /checkout in production — Owner: Platform Team`

### 9. What Went Well

Highlight **3–7 bullets** that describe positive aspects of the response:

- Effective collaboration, clear leadership, good use of runbooks
- Tools, dashboards, or alerts that were particularly helpful
- Any evidence of improvements from previous incidents paying off

This reinforces good practices and boosts psychological safety.

### 10. What Didn't Go Well

Be candid about:

- Delays in detection or escalation
- Tooling gaps and missing dashboards
- Confusion about ownership or decision-making
- Any procedural or communication issues

Focus on behaviors and systems, not people. Connect items to concrete CAPA tasks where appropriate.

### 11. Lessons Learned

Summarize **high-level insights** that should influence future design and process decisions:

- Reliability principles or anti-patterns revealed
- Architectural or process assumptions that turned out to be wrong
- How this informs future design, testing, and operational practices

Aim for 3–5 well-articulated lessons.

### 12. Open Questions / Follow-ups

List:

- Unknowns that still require investigation
- Data that needs to be collected or verified
- Decisions that remain to be made

Use checkboxes where appropriate, e.g.:

- [ ] Confirm whether any data older than 24h was affected
- [ ] Decide on default fail-open vs fail-closed behavior for the payment gateway

### 13. Appendix (Optional)

Include any of the following if available and useful:

- Graph screenshots or descriptions (error rates, latency, traffic)
- Excerpts of relevant logs (redacting sensitive data)
- Links to dashboards, PRs, config diffs, or related incidents
- Raw notes from the live incident channel, cleaned up for readability

---

## Output Requirements

- Produce a **single, cohesive report** in Markdown.
- Use clear headings (`##`, `###`) matching the structure above.
- Use bullet lists and tables where they improve clarity.
- Do **not** omit major sections; if something doesn't apply, include the heading with a short note (e.g., "No known data integrity impact.").
- Do not fabricate specific metrics or timestamps that are not implied by the input; instead, describe uncertainty transparently.

Generate a production-ready incident report that could be sent to engineering leadership and used as a basis for a client-facing summary.
"""
