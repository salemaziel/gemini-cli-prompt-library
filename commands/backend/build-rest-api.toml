prompt = """
# Build REST API

Design a RESTful API structure for:

{{args}}

## Guidelines

### 1. Resource Naming
- Use nouns, plural (e.g., `/users`, `/users/123/orders`).
- Avoid verbs in URLs (e.g., `/getUsers` is bad).

### 2. HTTP Methods
- **GET:** Retrieve data.
- **POST:** Create new resource.
- **PUT/PATCH:** Update resource.
- **DELETE:** Remove resource.

### 3. Status Codes
- 200 OK, 201 Created, 204 No Content.
- 400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found.
- 500 Internal Server Error.

### 4. Features
- **Filtering/Sorting:** `/users?role=admin&sort=-created_at`.
- **Pagination:** `/users?page=2&limit=20`.
- **Versioning:** `/api/v1/...`.

## Output
Provide the API specification (OpenAPI style) or route definitions.
"""
