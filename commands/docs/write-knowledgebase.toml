prompt = """
# Write Knowledge Base Article(s)

Create one or more knowledge base articles for the following topic, system, or recurring question:

{{args}}

Assume the audience is a mix of future you, semi-technical clients, and potential collaborators. Articles should be **task-oriented** and easy to scan.

---

## 1. Define the KB Structure

1. Identify 1–3 concrete article topics implied by {{args}}.
2. For each article:
   - Give a clear, descriptive title.
   - Define its target reader (e.g. "client editor", "operator", "developer").
   - State its main outcome ("after reading this you can…").

List the articles in a small outline first.

---

## 2. Article Template

For each article, follow this structure:

1. **Overview**
   - 2–4 sentences describing what this article covers and when to use it.
2. **Prerequisites**
   - Access, role, or basic knowledge required.
3. **Step-by-Step Instructions**
   - Numbered steps to complete the task.
   - Include brief explanations and validation checks.
4. **Common Issues & Fixes**
   - Short list of problems and simple resolutions.
5. **Related Articles**
   - Pointers to other KB entries that might be helpful.

---

## 3. Tone & Style

Write:

1. In clear, direct language, avoiding unnecessary jargon.
2. With consistent terminology for systems, roles, and features.
3. Using headings, bullets, and emphasis to make the content scannable.

Where technical details are needed, explain them briefly in context.

---

## 4. Output Format

Output:

1. A short **index** at the top listing the KB articles you're creating (titles + 1-line description).
2. Then, for each article, the full content using the template:
   - Overview
   - Prerequisites
   - Step-by-Step Instructions
   - Common Issues & Fixes
   - Related Articles

Structure everything so it can be pasted into a documentation system (Notion, docs site, etc.) with minimal editing.
"""
